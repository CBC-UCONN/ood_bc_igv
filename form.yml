---
cluster: "mantis"

attributes:
  bc_vnc_idle: 0

  bc_vnc_resolution:
    required: true

  custom_memory:
    widget: "number_field"
    label: "GB Memory"
    help: "GB of memory to request. 8 is generally sufficient."
    value: 8
    max: 32
    display: true

  bc_num_hours:
    widget: "number_field"
    label: "Hours"
    help: "The number of hours to request for the session."
    value: 1
    max: 12
    display: true

form:
  - bc_num_hours
  - custom_memory
